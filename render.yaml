services:
  - type: web
    name: peertutoringpro-backend
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    disk:
      name: peertutoringpro-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: COOKIE_SAME_SITE
        value: None
      - key: COOKIE_SECURE
        value: "true"
      - key: DB_PATH
        value: /opt/render/project/src/data/database.db
